[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fexact"
dynamic = ["version"]  # from Cargo.toml
description = "Exact Fisher test for nxm contingency matrix based on fortran acm 643 and R"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
authors = [{ name = "A. Boussoffara", email = "boussoffara@me.com" }]
keywords = ["fisher", "fishertest", "fisherexact"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
"Source Code" = "https://github.com/boussoffara/fexact"

[tool.maturin]
features = ["python"]
module-name = "fexact"

[tool.pytest.ini_options]
testpaths = ["tests"]
