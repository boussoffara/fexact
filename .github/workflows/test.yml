name: Run Tests
on: [push, pull_request]
jobs:
  rust:
    name: Rust (cargo test, clippy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Test (unit tests + golden corpus)
      run: cargo test
    - name: Clippy
      run: cargo clippy --features python --all-targets -- -D warnings

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python }}
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build and install (maturin)
      run: pip install .[test]
    - name: Test
      run: pytest

  parity:
    name: Parity with the C reference
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.12"
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build the C reference
      run: |
        pip install numpy setuptools
        python legacy/setup.py build_ext --inplace
    - name: Build and install (maturin)
      run: pip install .[test]
    - name: Compare with C
      run: pytest tests/test_parity.py -rs
