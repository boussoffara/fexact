name: Greetings

on: [pull_request_target, issues]

# Comments on first-time contributors' issues and pull requests.
# (`pull_request_target` so that PRs from forks get a token that can comment;
# the workflow checks out no code from the PR.)
permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v3
      with:
        pr_message: 'Hello @${{ github.actor }}, thank you for submitting a PR! We will respond as soon as possible.'
        issue_message: |
          Hello @${{ github.actor }}, thank you for your interest in our work!

          If this is a bug report, please provide screenshots and **minimum viable code to reproduce your issue**, otherwise we can not help you.
